<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Directive Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3dd;
    --accent: #4f46e5; --accent-soft: #eef0ff; --think: #7c6f9b; --warn: #b45309; --warn-soft: #fff7e8;
    --bad: #b42318; --bad-soft: #fff1f0; --good: #15803d; --code-bg: #17171a; --code-ink: #e7e7ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --panel: #18181b; --ink: #ececea; --muted: #9a9a94; --line: #2a2a2e;
      --accent: #8b8cff; --accent-soft: #23234a; --think: #b3a6d6; --warn: #f5b454; --warn-soft: #2d2410;
      --bad: #ff8a80; --bad-soft: #2e1614; --good: #4ade80; --code-bg: #0b0b0d; --code-ink: #e7e7ea;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 20px 14px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
  aside h1 { font-size: 16px; margin: 0 6px 16px; letter-spacing: -0.01em; }
  .run { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 10px; border-radius: 8px; cursor: pointer; }
  .run:hover { background: var(--bg); }
  .run.active { background: var(--accent-soft); }
  .run .d { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; }
  .run .t { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.running { background: var(--good); animation: pulse 1.4s infinite; }
  .dot.waiting { background: var(--warn); animation: pulse 1.4s infinite; }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; gap: 12px; align-items: center; }
  header .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  #feed { flex: 1; padding: 24px 28px 160px; max-width: 920px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .ev { animation: in 0.25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .directive { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 14px 16px; font-size: 16px; }
  .thinking { color: var(--think); font-style: italic; padding-left: 14px; border-left: 2px solid color-mix(in srgb, var(--think) 40%, transparent); white-space: pre-wrap; }
  .message { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; white-space: pre-wrap; }
  pre { margin: 0; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  .code pre { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; }
  .output pre { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted); }
  details.result { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  details.result summary { cursor: pointer; font: 13px "JetBrains Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; list-style: none; }
  details.result summary::before { content: "↳ "; color: var(--muted); }
  details.result[open] summary { margin-bottom: 8px; }
  details.result.threw { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); color: var(--bad); }
  .question { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); color: var(--ink); border-radius: 12px; padding: 12px 16px; }
  .question .label { color: var(--warn); }
  .reply { align-self: flex-end; max-width: 80%; background: var(--accent); color: white; border-radius: 12px 12px 4px 12px; padding: 10px 14px; white-space: pre-wrap; }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form { position: fixed; bottom: 0; left: 280px; right: 0; padding: 16px 28px 22px; background: linear-gradient(transparent, var(--bg) 35%); }
  form .box { max-width: 920px; margin: 0 auto; display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.06); }
  form.waiting .box { border-color: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; padding: 8px; min-height: 40px; max-height: 160px; }
  button.send { border: 0; background: var(--accent); color: white; font: 500 14px Inter, sans-serif; border-radius: 10px; padding: 0 18px; cursor: pointer; }
  button.send:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
    #runs { display: flex; overflow-x: auto; gap: 6px; }
    .run { min-width: 220px; }
    header, #feed { padding-left: 16px; padding-right: 16px; }
    form { left: 0; padding: 12px 16px 16px; }
    .meta { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Directive Agent</h1>
    <div id="runs"></div>
  </aside>
  <main>
    <header>
      <span class="title" id="title">No run selected</span>
      <span class="meta" id="meta"></span>
      <span class="pill" id="status" hidden><span class="dot"></span><span></span></span>
    </header>
    <div id="feed"><p class="empty">Start the agent with <code>npm start</code> and its run shows up here.</p></div>
  </main>
</div>
<form id="reply" hidden>
  <div class="box">
    <textarea id="text" rows="1" placeholder="Reply to the agent…"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
</form>
<script type="module">
  import { createClient } from "https://esm.sh/@base44/sdk@0.8.52";
  import { APP_ID } from "./config.js";

  const base44 = createClient({ appId: APP_ID, appBaseUrl: location.origin, requiresAuth: true });
  const { AgentRun, AgentEvent } = base44.entities;
  const $ = (id) => document.getElementById(id);
  const STATUS_TEXT = { running: "Working", waiting: "Waiting for you", done: "Finished", error: "Error" };

  let runs = [];
  let runId = new URLSearchParams(location.search).get("run");
  let shown = new Set();
  let lastSeq = 0;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function labelled(cls, label, body) {
    const wrap = el("div", `ev ${cls}`);
    wrap.append(el("div", "label", label), body);
    return wrap;
  }

  function renderEvent(e) {
    const c = e.content ?? "";
    switch (e.kind) {
      case "directive": return labelled("", "Directive", el("div", "directive", c));
      case "thinking": return labelled("", "Thinking", el("div", "thinking", c));
      case "message": return labelled("", "Agent", el("div", "message", c));
      case "code": { const w = el("div", "code"); w.append(el("pre", "", c)); return labelled("", "Runs JavaScript", w); }
      case "output": { const w = el("div", "output"); w.append(el("pre", "", c)); return labelled("", "Printed", w); }
      case "result": {
        const d = el("details", `ev result${c.startsWith("Threw ") ? " threw" : ""}`);
        d.append(el("summary", "", c.split("\n")[0] || "(empty)"));
        if (c.includes("\n")) d.append(el("pre", "", c));
        return d;
      }
      case "question": return labelled("question", "Agent asks", el("div", "", c));
      case "reply": case "user": return Object.assign(el("div", "ev reply", c), { title: e.kind === "user" ? "Typed in the terminal" : "Sent from this page" });
      case "error": return labelled("", "Error", el("div", "error", c));
      default: return el("div", "ev message", c);
    }
  }

  function renderRuns() {
    $("runs").replaceChildren(...runs.map((r) => {
      const b = el("button", `run${r.id === runId ? " active" : ""}`);
      const t = el("div", "t");
      t.append(el("span", `dot ${r.status}`), el("span", "", `${STATUS_TEXT[r.status] ?? r.status} · ${new Date(r.created_date).toLocaleString()}`));
      b.append(el("div", "d", r.directive), t);
      b.onclick = () => selectRun(r.id);
      return b;
    }));
  }

  function renderHeader() {
    const run = runs.find((r) => r.id === runId);
    $("title").textContent = run ? run.directive : "No run selected";
    $("meta").textContent = run ? [run.model, run.host].filter(Boolean).join(" · ") : "";
    $("status").hidden = !run;
    $("reply").hidden = !run || run.status === "done";
    $("reply").classList.toggle("waiting", run?.status === "waiting");
    if (run) {
      $("status").querySelector(".dot").className = `dot ${run.status}`;
      $("status").lastElementChild.textContent = STATUS_TEXT[run.status] ?? run.status;
    }
  }

  function selectRun(id) {
    runId = id;
    shown = new Set();
    lastSeq = 0;
    $("feed").replaceChildren();
    history.replaceState(null, "", `?run=${id}`);
    renderRuns();
    renderHeader();
    refreshEvents();
  }

  async function refreshEvents() {
    if (!runId) return;
    const id = runId;
    const events = await AgentEvent.filter({ run_id: id }, "created_date", 5000);
    if (id !== runId) return;
    const fresh = events.filter((e) => !shown.has(e.id))
      .sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0) || a.created_date.localeCompare(b.created_date));
    if (!fresh.length) return;
    const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 200;
    for (const e of fresh) {
      shown.add(e.id);
      lastSeq = Math.max(lastSeq, e.seq ?? 0);
      $("feed").append(renderEvent(e));
    }
    if (nearBottom) scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  async function refreshRuns() {
    runs = await AgentRun.list("-created_date", 30);
    if (!runId && runs.length) return selectRun(runs[0].id);
    renderRuns();
    renderHeader();
  }

  $("reply").onsubmit = async (event) => {
    event.preventDefault();
    const content = $("text").value.trim();
    if (!content || !runId) return;
    $("send").disabled = true;
    try {
      await AgentEvent.create({ run_id: runId, kind: "reply", content, seq: lastSeq + 0.5 });
      $("text").value = "";
      await refreshEvents();
    } finally {
      $("send").disabled = false;
    }
  };
  $("text").onkeydown = (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("reply").requestSubmit(); }
  };

  async function tick() {
    try { await refreshRuns(); await refreshEvents(); } catch (error) { console.error(error); }
    setTimeout(tick, 1500);
  }
  if (await base44.auth.isAuthenticated()) tick();
</script>
</body>
</html>
